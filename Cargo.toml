[package]
name = "bareframe"
version = "0.2.3"
edition = "2024"
rust-version = "1.98"
publish = false
description = "A modular terminal workspace built with GPUI and Ghostty"
license = "AGPL-3.0-or-later"

[features]
default = ["runtime-shaders"]
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
bareframe-core = { path = "crates/bareframe-core" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "cc053a4a6fa2fd0e8793201ed9099466af1be0b1", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "cc053a4a6fa2fd0e8793201ed9099466af1be0b1", default-features = false, features = ["font-kit"] }
gpui-libghostty = { path = "vendor/gpui-libghostty/crates/gpui-ghostty" }
ignore = "0.4"
notify = "8"
serde_json = "1"
# Chromium for browser panes (CEF 156; cef-rs is Apache-2.0/MIT, CEF BSD). Its framework and
# helper apps are laid into the bundle by script/bundle. Renderers run in Chromium's sandbox.
cef = { version = "=156.2.0", default-features = false, features = ["sandbox"] }
objc2 = "0.6.3"
raw-window-handle = "0.6"
# Verifies the signature on downloaded updates; the release key lives with the maintainer.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
futures = "0.3"
grep = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
trash = "5"
# Tree-sitter grammars for the editor's colors; only MIT-licensed ones are enabled.
arborium = { version = "2.18", default-features = false, features = [
    "lang-bash",
    "lang-c",
    "lang-cpp",
    "lang-css",
    "lang-dockerfile",
    "lang-go",
    "lang-html",
    "lang-java",
    "lang-javascript",
    "lang-json",
    "lang-lua",
    "lang-markdown",
    "lang-python",
    "lang-ruby",
    "lang-rust",
    "lang-sql",
    "lang-swift",
    "lang-toml",
    "lang-tsx",
    "lang-typescript",
    "lang-yaml",
] }
# Already built for GPUI; used here only to read a picture's size from its header.
image = { version = "0.25", default-features = false }
# Mermaid diagrams in the Markdown viewer (MIT/Apache). Compared with mmdr, mermaid-svg and
# Warp's mermaid-to-svg on a real design document, it alone drew subgraphs and busy state
# diagrams correctly. Only SVG output and common diagram kinds are built, to keep it lean.
merman = { version = "0.9.2", default-features = false, features = [
    "svg",
    "native-fonts",
    "layout-elk",
    "diagram-class",
    "diagram-er",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-journey",
    "diagram-mindmap",
    "diagram-pie",
    "diagram-sequence",
    "diagram-state",
    "diagram-timeline",
] }
# The allocator for Rust's memory (see main.rs).
mimalloc = "0.1.52"
# Screenshots arrive in base64 (bareframe-browser).
base64 = "0.22"

# Dependencies (GPUI's layout and text shaping, tree-sitter, the Mermaid layout) run many
# times slower unoptimized, which made the app itself sluggish. They are built optimized
# even in dev; bareframe's own code stays quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"


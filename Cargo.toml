[package]
name = "bareframe"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "A modular terminal workspace built with GPUI and Ghostty"
license = "AGPL-3.0-or-later"

[features]
default = ["runtime-shaders"]
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
bareframe-core = { path = "crates/bareframe-core" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "cc053a4a6fa2fd0e8793201ed9099466af1be0b1", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "cc053a4a6fa2fd0e8793201ed9099466af1be0b1", default-features = false, features = ["font-kit"] }
gpui-libghostty = { path = "vendor/gpui-libghostty/crates/gpui-ghostty" }
ignore = "0.4"
notify = "8"
futures = "0.3"
grep = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
trash = "5"
# Already built for GPUI; used here only to read a picture's size from its header.
image = { version = "0.25", default-features = false }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

